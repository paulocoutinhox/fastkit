log_format fastkit '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name change-me.com;

    client_max_body_size 512m;
    access_log /var/log/nginx/access.log fastkit;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The body is buffered here and only then handed over, so the wait for an answer is the time the application takes to store a file of up to 512 MB.
        proxy_read_timeout 300s;
    }
}
