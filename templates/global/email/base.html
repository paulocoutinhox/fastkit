<!doctype html>
<html lang="{{ language }}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{ subject }}</title>
    </head>
    <body style="margin: 0; padding: 24px; background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; color: #1e293b">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden">
            <tr>
                <td style="padding: 20px 28px; background: #1e293b; color: #ffffff; font-size: 16px; font-weight: 600">{{ brand }}</td>
            </tr>
            <tr>
                <td style="padding: 28px; font-size: 15px; line-height: 1.6">{% block content %}{% endblock %}</td>
            </tr>
            <tr>
                <td style="padding: 16px 28px; background: #f8fafc; color: #64748b; font-size: 12px">{{ brand }}</td>
            </tr>
        </table>
    </body>
</html>
