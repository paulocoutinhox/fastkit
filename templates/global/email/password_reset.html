{% extends "email/base.html" %}

{% block content %}
<p style="margin: 0 0 16px">{{ t("email.password-reset-intro") }}</p>

<p style="margin: 0 0 24px"><a href="{{ link }}" style="display: inline-block; padding: 12px 20px; background: #1d4ed8; border-radius: 10px; color: #ffffff; font-weight: 600; text-decoration: none">{{ t("email.password-reset-action") }}</a></p>

<p style="margin: 0 0 8px; color: #64748b">{{ t("email.password-reset-code") }}</p>

<p style="margin: 0 0 16px; padding: 16px; background: #f1f5f9; border-radius: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 20px; letter-spacing: 1px; text-align: center; word-break: break-all">{{ token }}</p>

<p style="margin: 0 0 16px">{{ t("email.password-reset-validity", hours=hours) }}</p>

<p style="margin: 0; color: #64748b">{{ t("email.password-reset-ignore") }}</p>
{% endblock %}
