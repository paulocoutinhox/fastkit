{% extends "site/layouts/base.html" %}

{% block title %}{{ t('site.not-found') }} — {{ brand.name }}{% endblock %}

{% block content %}

        <div class="card-body items-center text-center">
            <h1 class="text-2xl font-semibold text-base-content">{{ t('site.not-found') }}</h1>
            <p class="mt-2 text-base-content/70">{{ t('site.not-found-lead') }}</p>
            <a href="{{ url('/') }}" class="btn btn-primary mt-6">{{ t('site.back-home') }}</a>
        </div>
    </div>
{% endblock %}
