<form method="post" action="{{ url('/theme') }}" class="shrink-0">
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}" />
    <input type="hidden" name="next" value="{{ request.url.path }}" />
    <input type="hidden" name="theme" value="{{ next_theme }}" />

    {% set where = {'system': t('site.theme-system'), 'light': t('site.theme-light'), 'dark': t('site.theme-dark')}[next_theme] %}

    <button
        type="submit"
        class="btn btn-ghost btn-square"
        aria-label="{{ where }}"
        title="{{ where }}"
    >
        {% if theme == 'dark' %}
            <svg viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4" aria-hidden="true">
                <path d="M10 3a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0 1a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1Zm7-5a1 1 0 0 1-1 1h-1a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1ZM5 10a1 1 0 0 1-1 1H3a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1Zm10.07-5.07a1 1 0 0 1 0 1.41l-.71.71a1 1 0 1 1-1.41-1.41l.7-.71a1 1 0 0 1 1.42 0ZM7.05 12.95a1 1 0 0 1 0 1.41l-.71.71a1 1 0 0 1-1.41-1.42l.7-.7a1 1 0 0 1 1.42 0Zm8.02 2.12a1 1 0 0 1-1.42 0l-.7-.71a1 1 0 0 1 1.41-1.41l.71.7a1 1 0 0 1 0 1.42ZM4.93 4.93a1 1 0 0 1 1.42 0l.7.71A1 1 0 0 1 5.64 7.05l-.71-.7a1 1 0 0 1 0-1.42Z" />
            </svg>
        {% elif theme == 'light' %}
            <svg viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4" aria-hidden="true">
                <path d="M10.5 2a.9.9 0 0 1 .3 1.2 5.5 5.5 0 0 0 6 8 .9.9 0 0 1 1 1.3A7.5 7.5 0 1 1 9.4 2.1a.9.9 0 0 1 1.1-.1Z" />
            </svg>
        {% else %}
            <svg viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4" aria-hidden="true">
                <path d="M4 4h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4v1h1a1 1 0 1 1 0 2H7a1 1 0 1 1 0-2h1v-1H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 2v6h12V6Z" />
            </svg>
        {% endif %}
    </button>
</form>
