name: Test

on:
  # A push that carries no file the filter below lets through never runs, so this is how one is asked for.
  workflow_dispatch:
  push:
    paths-ignore:
      - AGENTS.md
      - CLAUDE.md
      - README.md
      - docs/**
      - extras/**

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install what the front ends build with
        run: npm ci --prefix webapps/admin

      - name: Install what the site builds with
        run: npm ci --prefix webapps/site

      - name: Lint
        run: make lint

      - name: Test
        run: make test-cov

  admin:
    name: Admin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix webapps/admin

      - name: Test
        run: make admin-test

      - name: Build
        run: make admin-build

  site:
    name: Site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapps/site/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix webapps/site

      - name: Test
        run: make site-test

      - name: Build
        run: make site-build

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make docker-build
